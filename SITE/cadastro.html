<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro RFID</title><style>
body{font-family:Arial;margin:0;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:#fff;padding:20px;display:flex;justify-content:space-between}a{color:#fff;margin:8px;text-decoration:none}.wrap{max-width:1200px;margin:25px auto;width:94%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:20px}label{display:block;font-weight:bold;margin-top:12px}input{width:100%;padding:11px;margin-top:5px;box-sizing:border-box}button{padding:11px 15px;border:0;border-radius:7px;margin-top:12px;font-weight:bold;cursor:pointer}.green{background:#10b981;color:#fff}.blue{background:#2563eb;color:#fff}.red{background:#dc2626;color:#fff}.uid{font:22px monospace;color:#2563eb}.msg{font-weight:bold;margin-top:10px}.ok{color:#15803d}.bad{color:#b91c1c}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}@media(max-width:800px){.grid{grid-template-columns:1fr}header{flex-direction:column}}
</style></head><body><header><b>🏷️ Inventário RFID — Cadastro</b><nav><a href="/">Dashboard</a><a href="/cadastro">Cadastro</a><a href="/controle">Empréstimos</a></nav></header><div class="wrap"><h1>Cadastro</h1><div id="alert"></div><div class="grid">
<div class="card"><h2>👤 Funcionário</h2><form id="f"><label>Nome</label><input id="fn" required><label>Matrícula</label><input id="fm" required><label>Setor</label><input id="fs"><label>Tag RFID</label><input id="fu" readonly required><button type="button" class="green" onclick="ler('funcionario')">📡 LER TAG</button><button class="blue">CADASTRAR FUNCIONÁRIO</button></form><div id="mf" class="msg"></div></div>
<div class="card"><h2>🔧 Equipamento</h2><form id="e"><label>Nome</label><input id="en" required><label>Descrição</label><input id="ed"><label>Box</label><input id="eb" type="number" min="1" required><label>Tag RFID</label><input id="eu" readonly required><button type="button" class="green" onclick="ler('equipamento')">📡 LER TAG</button><button class="blue">CADASTRAR EQUIPAMENTO</button></form><div id="me" class="msg"></div></div></div>
<div class="card"><h2>📡 Última leitura</h2><div id="uid" class="uid">---</div><div id="rm" class="msg">Aguardando...</div></div>
<div class="card"><h2>Funcionários</h2><div class="scroll"><table><thead><tr><th>ID</th><th>Nome</th><th>Matrícula</th><th>Setor</th><th>UID</th><th></th></tr></thead><tbody id="ft"></tbody></table></div></div>
<div class="card"><h2>Equipamentos</h2><div class="scroll"><table><thead><tr><th>ID</th><th>Nome</th><th>UID</th><th>Box</th><th>Status</th><th></th></tr></thead><tbody id="et"></tbody></table></div></div></div>
<script>
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let modo=null,last=0;
async function api(u,o={}){let r=await fetch(u,{cache:"no-store",...o,headers:{"Content-Type":"application/json",...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.erro||d.mensagem||"Erro");return d}
function alertx(t,ok=false){$("alert").innerHTML='<p class="'+(ok?"ok":"bad")+'">'+esc(t)+"</p>"}
async function ler(t){modo=t;try{await api("/api/rfid/cadastro/iniciar",{method:"POST",body:JSON.stringify({tipo:t})});$("rm").textContent="🟡 Aguardando tag..."}catch(e){alertx(e.message)}}
async function poll(){try{let d=await api("/rfid/ultima");if(d.nova&&Number(d.id)>last){last=Number(d.id);$("uid").textContent=d.uid||"---";$("rm").textContent=d.mensagem||d.tipo;if(modo==="funcionario"&&d.tipo==="cadastro_funcionario_tag"){$("fu").value=d.uid;$("mf").textContent="Tag lida. Pode cadastrar.";modo=null}if(modo==="equipamento"&&d.tipo==="cadastro_equipamento_tag"){$("eu").value=d.uid;$("me").textContent="Tag lida. Pode cadastrar.";modo=null}if(d.tipo==="tag_ja_cadastrada"){alertx(d.mensagem||d.erro);modo=null}}}catch(e){}}
async function load(){try{let f=await api("/api/funcionarios");$("ft").innerHTML=(f.funcionarios||[]).map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.nome)}</td><td>${esc(x.matricula)}</td><td>${esc(x.setor||"-")}</td><td>${esc(x.uid_tag_pessoal)}</td><td><button class="red" onclick="delF(${x.id})">Excluir</button></td></tr>`).join("");let e=await api("/api/equipamentos");$("et").innerHTML=(e.equipamentos||[]).map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.nome)}</td><td>${esc(x.uid_tag)}</td><td>${esc(x.box_id)}</td><td>${esc(x.status)}</td><td><button class="red" onclick="delE(${x.id})">Excluir</button></td></tr>`).join("")}catch(e){alertx(e.message)}}
$("f").onsubmit=async ev=>{ev.preventDefault();try{let d=await api("/api/funcionarios",{method:"POST",body:JSON.stringify({nome:$("fn").value,matricula:$("fm").value,setor:$("fs").value,uid_tag_pessoal:$("fu").value})});alertx(d.mensagem,true);ev.target.reset();load()}catch(e){alertx(e.message)}};
$("e").onsubmit=async ev=>{ev.preventDefault();try{let d=await api("/api/equipamentos",{method:"POST",body:JSON.stringify({nome:$("en").value,descricao:$("ed").value,box_id:$("eb").value,uid_tag:$("eu").value})});alertx(d.mensagem,true);ev.target.reset();load()}catch(e){alertx(e.message)}};
async function delF(id){if(confirm("Excluir funcionário?"))try{let d=await api("/api/funcionarios/"+id,{method:"DELETE"});alertx(d.mensagem,true);load()}catch(e){alertx(e.message)}}
async function delE(id){if(confirm("Excluir equipamento?"))try{let d=await api("/api/equipamentos/"+id,{method:"DELETE"});alertx(d.mensagem,true);load()}catch(e){alertx(e.message)}}
load();setInterval(load,5000);setInterval(poll,500);
</script></body></html>
