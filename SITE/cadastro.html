<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Inventário RFID</title><style>
body{font-family:Segoe UI,Arial;margin:0;background:#f4f7fb;color:#10213a}header{background:#0f172a;color:#fff;padding:22px 6%}main{max-width:900px;margin:25px auto;width:92%}.card{background:#fff;padding:24px;border-radius:18px;margin:15px 0}input,select{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ccd6e3;border-radius:10px;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:700}.nav{color:white;text-decoration:none;margin-right:15px}</style></head><body><header><h1>🛠️ Cadastro RFID</h1><a class="nav" href="/">Dashboard</a><a class="nav" href="/controle">Controle</a></header><main><div class="card"><h2>Cadastrar funcionário</h2><form id="f"><input id="fn" placeholder="Nome" required><input id="fm" placeholder="Matrícula" required><input id="fu" placeholder="UID da tag pessoal" required><button>Salvar funcionário</button></form><p id="fmmsg"></p></div><div class="card"><h2>Cadastrar equipamento</h2><p>Regra: cada Box pode ter somente um objeto cadastrado.</p><form id="e"><input id="en" placeholder="Nome do equipamento" required><input id="eu" placeholder="UID da tag do equipamento" required><input id="eb" type="number" min="1" placeholder="Box" value="1" required><input id="ed" placeholder="Descrição"><button>Salvar equipamento</button></form><p id="emsg"></p></div></main><script>
async function post(url,data,msg){try{let r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}),d=await r.json();msg.textContent=d.mensagem||d.erro||"Concluído";}catch(e){msg.textContent=e.message}}
f.onsubmit=e=>{e.preventDefault();post("/api/funcionarios",{nome:fn.value,matricula:fm.value,uid_rfid:fu.value},fmmsg)}
document.getElementById("e").onsubmit=e=>{e.preventDefault();post("/api/equipamentos",{nome:en.value,uid_rfid:eu.value,box:Number(eb.value),descricao:ed.value},emsg)}
</script></body></html>
