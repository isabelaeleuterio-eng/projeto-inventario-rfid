<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro | Inventário RFID</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <h1>Cadastro</h1>
    <div class="sub">Cadastre funcionários e equipamentos. As listas e os indicadores ficam no Painel. A tag é lida diretamente no leitor RFID.</div>
  </div>

  <div class="grid2">
    <!-- FUNCIONÁRIO -->
    <section class="card">
      <div class="card-h"><h2>Novo funcionário</h2></div>
      <div class="card-b">
        <div id="avF"></div>
        <div class="field"><label for="fNome">Nome</label><input id="fNome" placeholder="Ex: Isabela Eleutério" autocomplete="off"></div>
        <div class="row2">
          <div class="field"><label for="fMat">Matrícula</label><input id="fMat" placeholder="Ex: SP3217485" autocomplete="off"></div>
          <div class="field"><label for="fSetor">Setor (opcional)</label><input id="fSetor" placeholder="Ex: Manutenção" autocomplete="off"></div>
        </div>
        <div class="field"><label for="fTag">Tag pessoal (crachá)</label>
          <div class="taginput"><input id="fTag" class="mono" placeholder="Passe a tag no leitor" autocomplete="off"><button class="btn" id="btnLerF" type="button">Ler tag</button></div>
          <div class="hint" id="hintF">Clique em "Ler tag" e aproxime o crachá do leitor.</div>
        </div>
        <button class="btn btn-primary" id="btnSalvarF" type="button" style="width:100%">Cadastrar funcionário</button>
      </div>
    </section>

    <!-- EQUIPAMENTO -->
    <section class="card">
      <div class="card-h"><h2>Novo equipamento</h2></div>
      <div class="card-b">
        <div id="avE"></div>
        <div class="field"><label for="eNome">Nome</label><input id="eNome" placeholder="Ex: Martelo" autocomplete="off"></div>
        <div class="field"><label for="eDesc">Descrição (opcional)</label><input id="eDesc" placeholder="Ex: Martelo de borracha 500 g" autocomplete="off"></div>
        <div class="field"><label for="eTag">Tag do equipamento</label>
          <div class="taginput"><input id="eTag" class="mono" placeholder="Passe a tag no leitor" autocomplete="off"><button class="btn" id="btnLerE" type="button">Ler tag</button></div>
          <div class="hint" id="hintE">Clique em "Ler tag" e aproxime a tag do equipamento do leitor.</div>
        </div>
        <button class="btn btn-primary" id="btnSalvarE" type="button" style="width:100%">Cadastrar equipamento</button>
      </div>
    </section>
  </div>
</main>

<script src="/app.js"></script>
<script>
montarTopo("cad"); iniciarPills();
const dorme = ms => new Promise(r => setTimeout(r, ms));

/* ---------- leitura de tag pelo leitor ---------- */
async function lerTag(tipo, input, btn, hint) {
  btn.disabled = true; btn.textContent = "Aguardando…";
  hint.textContent = "Aproxime a tag do leitor agora (até 30 segundos).";
  try {
    let base = (await api("/api/status")).rfid.id;
    await api("/api/rfid/cadastro/iniciar", { method: "POST", body: { tipo } });
    const limite = Date.now() + 30000;
    let achou = false;
    while (Date.now() < limite) {
      await dorme(900);
      const ev = (await api("/api/status")).rfid;
      if (ev.id === base) continue;
      base = ev.id;
      if (ev.tipo === "cadastro_tag") { input.value = ev.uid; hint.textContent = "Tag lida com sucesso."; achou = true; break; }
      if (ev.tipo === "tag_ja_cadastrada") { hint.textContent = ev.mensagem; achou = true; break; }
    }
    if (!achou) hint.textContent = "Tempo esgotado. Clique em \"Ler tag\" e tente de novo.";
  } catch (e) { hint.textContent = "Erro ao falar com o servidor: " + e.message; }
  btn.disabled = false; btn.textContent = "Ler tag";
}
$("#btnLerF").onclick = () => lerTag("funcionario", $("#fTag"), $("#btnLerF"), $("#hintF"));
$("#btnLerE").onclick = () => lerTag("equipamento", $("#eTag"), $("#btnLerE"), $("#hintE"));

/* ---------- salvar ---------- */
$("#btnSalvarF").onclick = async () => {
  const nome = $("#fNome").value.trim(), matricula = $("#fMat").value.trim(), tag = $("#fTag").value.trim();
  if (!nome || !matricula || !tag) return aviso("#avF", "bad", "Preencha nome, matrícula e a tag.");
  try {
    await api("/api/funcionarios", { method: "POST", body: { nome, matricula, setor: $("#fSetor").value.trim(), uid_tag_pessoal: tag } });
    aviso("#avF", "good", `${nome} cadastrado.`);
    ["#fNome", "#fMat", "#fSetor", "#fTag"].forEach(s => $(s).value = "");
    $("#hintF").textContent = 'Clique em "Ler tag" e aproxime o crachá do leitor.';
  } catch (e) { aviso("#avF", "bad", mensagemCadastro(e, "funcionario")); }
};
$("#btnSalvarE").onclick = async () => {
  const nome = $("#eNome").value.trim(), tag = $("#eTag").value.trim();
  if (!nome || !tag) return aviso("#avE", "bad", "Preencha o nome e a tag.");
  try {
    await api("/api/equipamentos", { method: "POST", body: { nome, descricao: $("#eDesc").value.trim(), uid_tag: tag } });
    aviso("#avE", "good", `${nome} cadastrado.`);
    ["#eNome", "#eDesc", "#eTag"].forEach(s => $(s).value = "");
    $("#hintE").textContent = 'Clique em "Ler tag" e aproxime a tag do equipamento do leitor.';
  } catch (e) { aviso("#avE", "bad", mensagemCadastro(e, "equipamento")); }
};

/* ---------- mensagens amigáveis ---------- */
function mensagemCadastro(erro, tipo) {
  const texto = String(erro?.message || "").toLowerCase();
  const dados = String(erro?.dados?.details || erro?.dados?.message || "").toLowerCase();
  const completo = texto + " " + dados;
  if (completo.includes("idx_funcionarios_matricula_ativo") || (completo.includes("matricula") && (completo.includes("duplicate") || completo.includes("unique")))) {
    return "Já existe um funcionário ativo com essa matrícula. Confira o número informado ou consulte o Painel.";
  }
  if (completo.includes("duplicate") || completo.includes("unique") || completo.includes("já está cadastrada") || completo.includes("ja esta cadastrada")) {
    return "Essa tag ou identificação já está cadastrada. Confira a tag e tente novamente.";
  }
  if (erro?.status === 400 || erro?.status === 409) {
    return erro.message || "Não foi possível concluir o cadastro. Confira os dados e tente novamente.";
  }
  return tipo === "funcionario"
    ? "Não foi possível cadastrar o funcionário agora. Confira os dados e tente novamente."
    : "Não foi possível cadastrar o equipamento agora. Confira os dados e tente novamente.";
}
</script>
</body>
</html>
