<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard RFID</title><style>
body{font-family:Arial;margin:0;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:#fff;padding:20px;display:flex;justify-content:space-between}a{color:#fff;margin:8px;text-decoration:none}.wrap{max-width:1200px;width:94%;margin:25px auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}.num{font-size:32px;font-weight:bold;margin-top:8px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}header{flex-direction:column}}
</style></head><body><header><b>🏷️ Inventário RFID — Dashboard</b><nav><a href="/">Dashboard</a><a href="/cadastro">Cadastro</a><a href="/controle">Empréstimos</a></nav></header><div class="wrap"><div class="cards"><div class="card">👥 Funcionários<div id="f" class="num">-</div></div><div class="card">🔧 Equipamentos<div id="e" class="num">-</div></div><div class="card">🟢 Disponíveis<div id="d" class="num">-</div></div><div class="card">📦 Emprestados<div id="p" class="num">-</div></div></div><div class="card" style="margin-top:20px"><h2>Equipamentos</h2><div class="scroll"><table><thead><tr><th>Nome</th><th>UID</th><th>Box</th><th>Status</th></tr></thead><tbody id="eq"></tbody></table></div></div><div class="card" style="margin-top:20px"><h2>Últimos empréstimos</h2><div class="scroll"><table><thead><tr><th>Funcionário</th><th>Equipamento</th><th>Box</th><th>Retirada</th><th>Devolução</th><th>Status</th></tr></thead><tbody id="h"></tbody></table></div></div></div><script>
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function a(u){let r=await fetch(u,{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.erro||"Erro");return d}
async function load(){try{let d=await a("/api/dashboard");$("f").textContent=d.funcionarios;$("e").textContent=d.equipamentos;$("d").textContent=d.disponiveis;$("p").textContent=d.emprestados;let e=await a("/api/equipamentos");$("eq").innerHTML=(e.equipamentos||[]).map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.uid_tag)}</td><td>${esc(x.box_id)}</td><td>${esc(x.status)}</td></tr>`).join("");let h=await a("/api/ultimos-emprestimos");$("h").innerHTML=(h.emprestimos||[]).filter(x=>x.status!=="Pendente RFID").map(x=>`<tr><td>${esc(x.funcionario?.nome||"-")}</td><td>${esc(x.equipamento?.nome||"-")}</td><td>${esc(x.box??x.equipamento?.box_id??"-")}</td><td>${x.data_retirada?new Date(x.data_retirada).toLocaleString("pt-BR"):"-"}</td><td>${x.data_devolucao?new Date(x.data_devolucao).toLocaleString("pt-BR"):"-"}</td><td>${x.data_devolucao?"Devolvido":"Emprestado"}</td></tr>`).join("")}catch(e){}}load();setInterval(load,5000);
</script></body></html>
