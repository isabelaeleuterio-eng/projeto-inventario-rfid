<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel | Inventário RFID</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <h1>Painel</h1>
    <div class="sub">Quem está com o quê e o histórico de movimentações.</div>
  </div>
  <div id="aviso"></div>

  <div class="stats">
    <div class="card stat"><div class="l">Funcionários</div><div class="v" id="stF">—</div></div>
    <div class="card stat"><div class="l">Equipamentos</div><div class="v b" id="stE">—</div></div>
    <div class="card stat"><div class="l">Disponíveis</div><div class="v g" id="stD">—</div></div>
    <div class="card stat"><div class="l">Fora da caixa</div><div class="v w" id="stU">—</div></div>
  </div>

  <section class="card" style="margin-bottom:20px">
    <div class="card-h"><h2>Em uso agora</h2></div>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>Equipamento</th><th>Funcionário</th><th>Retirada</th><th></th></tr></thead>
      <tbody id="tbUso"><tr><td class="empty" colspan="4">Carregando…</td></tr></tbody>
    </table></div>
  </section>

  <section class="card">
    <div class="card-h"><h2>Histórico</h2><span class="sub" id="contH"></span></div>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>Funcionário</th><th>Equipamento</th><th>Retirada</th><th>Devolução</th><th></th></tr></thead>
      <tbody id="tbH"><tr><td class="empty" colspan="5">Carregando…</td></tr></tbody>
    </table></div>
  </section>
</main>

<script src="/app.js"></script>
<script>
montarTopo("pn"); iniciarPills();

async function carregar() {
  try {
    const [d, h] = await Promise.all([api("/api/dashboard"), api("/api/emprestimos")]);
    $("#stF").textContent = d.funcionarios ?? 0;
    $("#stE").textContent = d.equipamentos ?? 0;
    $("#stD").textContent = d.disponiveis ?? 0;
    $("#stU").textContent = d.emprestimos ?? 0;

    const todos = h.emprestimos || [];
    const abertos = todos.filter(e => !e.data_devolucao);

    $("#tbUso").innerHTML = abertos.length ? abertos.map(e => `
      <tr><td><b>${esc(e.equipamento?.nome || "—")}</b></td><td>${esc(e.funcionario?.nome || "—")}</td>
      <td class="mono">${fmtData(e.data_retirada)}</td>
      <td style="text-align:right"><button class="btn btn-sm" data-dev="${e.id}">Registrar devolução</button></td></tr>`).join("")
      : `<tr><td class="empty" colspan="4">Nenhum equipamento fora da caixa.</td></tr>`;

    const hist = todos.slice(0, 50);
    $("#contH").textContent = todos.length > 50 ? "últimas 50 de " + todos.length : (todos.length ? todos.length + " movimentação(ões)" : "");
    $("#tbH").innerHTML = hist.length ? hist.map(e => `
      <tr><td>${esc(e.funcionario?.nome || "—")}</td><td>${esc(e.equipamento?.nome || "—")}</td>
      <td class="mono">${fmtData(e.data_retirada)}</td>
      <td>${e.data_devolucao ? `<span class="mono">${fmtData(e.data_devolucao)}</span>` : '<span class="badge warn">em aberto</span>'}</td>
      <td style="text-align:right">${e.data_devolucao ? `<button class="btn btn-sm btn-ghost" data-apagar="${e.id}">Apagar</button>` : ""}</td></tr>`).join("")
      : `<tr><td class="empty" colspan="5">Nenhuma movimentação ainda.</td></tr>`;
  } catch (e) { aviso("#aviso", "bad", "Erro ao carregar o painel: " + e.message, 0); }
}

document.addEventListener("click", async ev => {
  const dv = ev.target.closest("[data-dev]"), ap = ev.target.closest("[data-apagar]");
  try {
    if (dv) {
      if (!confirm("Registrar a devolução deste equipamento manualmente?")) return;
      await api(`/api/emprestimos/${dv.dataset.dev}/devolver`, { method: "PUT", body: {} });
      aviso("#aviso", "good", "Devolução registrada.");
    } else if (ap) {
      if (!confirm("Apagar esta movimentação do histórico?")) return;
      await api(`/api/emprestimos/${ap.dataset.apagar}`, { method: "DELETE" });
    } else return;
    carregar();
  } catch (e) { aviso("#aviso", "bad", e.message); }
});
carregar(); setInterval(carregar, 10000);
</script>
</body>
</html>
